name: build
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Convert SVG ke PNG (ikon HP, banner TV, logo intro)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin fonts-dejavu-core
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-nodpi
          rsvg-convert -w 192 -h 192 icons/icon.svg -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          rsvg-convert -w 512 -h 512 icons/icon.svg -o app/src/main/res/drawable-nodpi/logo.png
          rsvg-convert -w 640 -h 360 icons/banner.svg -o app/src/main/res/drawable-nodpi/banner.png
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/app-debug.apk
